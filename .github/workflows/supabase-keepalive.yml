name: Supabase Keepalive

on:
  schedule:
    - cron: '0 8,20 * * *' # twice daily at 08:00 and 20:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write # needed by prevent-workflow-disable to push a keepalive commit

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        # Issue several real DB queries per run. A single daily ping proved
        # insufficient: Supabase wants "a few user requests each day" to keep a
        # Free-plan project active, and flagged DentalOrder for pausing despite
        # 40+ days of one successful ping/day.
        run: |
          ENDPOINTS=(
            "products?select=id&limit=1"
            "products?select=id&limit=5"
            "cart_items?select=id&limit=5"
          )
          for EP in "${ENDPOINTS[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/${EP}" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
            echo "DentalOrder keepalive ping (${EP}): HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "::error::Keepalive ping failed for ${EP} with HTTP ${HTTP_CODE}"
              exit 1
            fi
          done

  prevent-workflow-disable:
    # GitHub disables scheduled workflows after 60 days of *repository* inactivity,
    # and cron/workflow_dispatch runs do NOT count as activity — only pushed
    # commits do. This job pushes an empty [skip ci] commit once the last commit
    # is >45 days old, keeping the repo "active" so the keepalive above never gets
    # mothballed. [skip ci] means Vercel ignores it — no deploy is triggered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push keepalive commit if repo is going stale
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Days since last commit: ${AGE_DAYS}"
          if [ "$AGE_DAYS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent scheduled-workflow disable [skip ci]"
            git push
            echo "Pushed keepalive commit to reset the 60-day inactivity timer."
          else
            echo "Repo still fresh (<45 days); no keepalive commit needed."
          fi
